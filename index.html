<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Wheel</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
  }
  button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<canvas id="wheel" width="340" height="340"></canvas>
  <p id="result" style="margin-top:15px;font-size:18px;font-weight:bold;"></p>
<button onclick="spin()">Spin</button>

<script>
const tasks = [
  "Listen sincerely without interrupting",
  "Do not complain today, see the good",
  "Speak calmly even when nervous",
  "Help someone without being noticed",
  "Greet the first person you meet",
  "Give water to a living being"
];

const colors = [
  "#F44336",
  "#FF9800",
  "#FFEB3B",
  "#4CAF50",
  "#2196F3",
  "#9C27B0"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const size = canvas.width;
const center = size / 2;
const sliceAngle = (2 * Math.PI) / tasks.length;

let currentAngle = 0;

/* TEXT COLOR BASED ON SLICE COLOR */
function getTextColor(hex) {
  const r = parseInt(hex.substr(1,2),16);
  const g = parseInt(hex.substr(3,2),16);
  const b = parseInt(hex.substr(5,2),16);
  const brightness = (r*299 + g*587 + b*114) / 1000;
  return brightness > 150 ? "#000" : "#fff";
}

/* MULTI-LINE CENTERED TEXT */
function drawWrappedText(text, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let lines = [];

  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + " ";
    if (ctx.measureText(test).width > maxWidth && i > 0) {
      lines.push(line);
      line = words[i] + " ";
    } else {
      line = test;
    }
  }
  lines.push(line);

  const startY = y - (lines.length - 1) * lineHeight / 2;
  lines.forEach((l, i) => {
    ctx.fillText(l.trim(), 0, startY + i * lineHeight);
  });
}

/* DRAW WHEEL */
function drawWheel() {
  ctx.clearRect(0, 0, size, size);

  for (let i = 0; i < tasks.length; i++) {
    const start = currentAngle + i * sliceAngle;
    const end = start + sliceAngle;
    const sliceColor = colors[i];

    // slice
    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, center, start, end);
    ctx.fillStyle = sliceColor;
    ctx.fill();

    // text
    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + sliceAngle / 2);
    ctx.rotate(Math.PI / 2);

    ctx.fillStyle = getTextColor(sliceColor);
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    drawWrappedText(tasks[i], -center * 0.6, 140, 16);

    ctx.restore();
  }
}

function spin() {
  const spinAngle = Math.random() * 360 + 1440;
  currentAngle += spinAngle * Math.PI / 180;

  canvas.style.transition = "transform 4s ease-out";
  canvas.style.transform = `rotate(${currentAngle}rad)`;

  setTimeout(() => {
    // Normalize angle (0 - 2PI)
    const normalizedAngle =
      (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);

    const index =
      Math.floor(normalizedAngle / sliceAngle) % tasks.length;

    document.getElementById("result").innerText =
      "Selected task: " + tasks[index];
  }, 4000);
}
}

drawWheel();
</script>

</body>
</html>
