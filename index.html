<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görev Çarkı</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f2f2f2;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
}

.arrow {
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 25px solid #333;
  margin: 0 auto 10px;
}

.wheel-container {
  position: relative;
}

canvas {
  border-radius: 50%;
  background: #fff;
}

button {
  margin-top: 20px;
  padding: 14px 24px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #4CAF50;
  color: #fff;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <div class="arrow"></div>

  <div class="wheel-container">
    <canvas id="wheel" width="300" height="300"></canvas>
  </div>

  <button onclick="spin()">Çarkı Çevir</button>

  <p id="result"></p>
</div>

<script>
const tasks = [
  "Bugün kimsenin sözünü kesme, sadece canıgönülden dinle.",
  "Bugün hiç şikayet etme, sadece olanın güzel yanını gör.",
  "En gergin anında bile ses tonunu bir tık alçaltarak konuş.",
  "Kimsenin haberi olmadan birinin bir işini kolaylaştır",
  "Karşılaştığın ilk kişiye selam ver.",
  "Bir canlıya (kuş, kedi, çiçek) su ver."
];

const colors = [
  "#f44336", "#2196F3", "#4CAF50",
  "#FFC107", "#9C27B0", "#FF9800"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const size = canvas.width;
const center = size / 2;
const sliceAngle = 2 * Math.PI / tasks.length;

let currentAngle = 0;

function drawWheel() {
  for (let i = 0; i < tasks.length; i++) {
    const start = sliceAngle * i;
    const end = start + sliceAngle;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, center, start, end);
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + sliceAngle / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "14px Arial";
    ctx.fillText(tasks[i], center - 10, 5);
    ctx.restore();
  }
}

drawWheel();

function spin() {
  const spinAngle = Math.random() * 360 + 1440;
  currentAngle += spinAngle;

  canvas.style.transition = "transform 4s ease-out";
  canvas.style.transform = `rotate(${currentAngle}deg)`;

  const selectedIndex = Math.floor(
    tasks.length - (currentAngle % 360) / (360 / tasks.length)
  ) % tasks.length;

  setTimeout(() => {
    document.getElementById("result").innerHTML =
      "🎯 Görev: <b>" + tasks[selectedIndex] + "</b>";
  }, 4000);
}
</script>

</body>
</html>
