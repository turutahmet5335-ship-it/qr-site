<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görev Çarkı</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f2f2f2;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
}



canvas {
  border-radius: 50%;
  background: #fff;
}

button {
  margin-top: 20px;
  padding: 14px 24px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #4CAF50;
  color: #fff;
  cursor: pointer;
}

#result {
  margin-top: 15px;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
  
  <canvas id="wheel" width="340" height="340"></canvas>
  <button onclick="spin()">Çarkı Çevir</button>
  <div id="result"></div>
</div>

<script>
const tasks = [
  "Bugün kimsenin sözünü kesme, sadece canıgönülden dinle.",
  "Bugün hiç şikayet etme, sadece olanın güzel yanını gör.",
  "En gergin anında bile ses tonunu bir tık alçaltarak konuş.",
  "Kimsenin haberi olmadan birinin bir işini kolaylaştır.",
  "Karşılaştığın ilk kişiye selam ver.",
  "Bir canlıya (kuş, kedi, çiçek) su ver."
];

const colors = [
  "#f44336", "#2196F3", "#4CAF50",
  "#FFC107", "#9C27B0", "#FF9800"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const size = canvas.width;
const center = size / 2;
const sliceAngle = 2 * Math.PI / tasks.length;

let currentAngle = 0;

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let lines = [];

  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + " ";
    if (ctx.measureText(testLine).width > maxWidth && i > 0) {
      lines.push(line);
      line = words[i] + " ";
    } else {
      line = testLine;
    }
  }
  lines.push(line);

  const offsetY = y - (lines.length - 1) * lineHeight / 2;
  lines.forEach((l, i) => {
    ctx.fillText(l.trim(), x, offsetY + i * lineHeight);
  });
}

function drawWheel() {
  for (let i = 0; i < tasks.length; i++) {
    const start = sliceAngle * i;
    const end = start + sliceAngle;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, center, start, end);
    ctx.fillStyle = colors[i % colors.length];

    ctx.save();
ctx.translate(center, center);

// angle of the middle of the slice
const middleAngle = startAngle + sliceAngle / 2;

// rotate to slice center
ctx.rotate(middleAngle);

// keep text upright
ctx.rotate(Math.PI / 2);

ctx.textAlign = "center";
ctx.textBaseline = "middle";

// OPTIONAL: text color based on slice color
ctx.fillStyle = getTextColor(colors[i % colors.length]);
ctx.font = "12px Arial";

drawWrappedText(
  ctx,
  tasks[i],
  0,
  -center * 0.6, // exact radial center of the slice
  140,
  16
);

ctx.restore();
  }
}

drawWheel();

function spin() {
  const spinAngle = Math.random() * 360 + 1440;
  currentAngle += spinAngle;

  canvas.style.transition = "transform 4s ease-out";
  canvas.style.transform = `rotate(${currentAngle}deg)`;

  const selectedIndex =
    Math.floor(tasks.length - (currentAngle % 360) / (360 / tasks.length)) %
    tasks.length;

  setTimeout(() => {
    document.getElementById("result").innerHTML =
      "🎯 Görev: <b>" + tasks[selectedIndex] + "</b>";
  }, 4000);
}
</script>

</body>
</html>
