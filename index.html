<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görev Çarkı</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
  }

  button {
    margin-top: 20px;
    padding: 12px 26px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #4CAF50;
    color: #fff;
    cursor: pointer;
  }

  #result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>

<body>

<canvas id="wheel" width="320" height="320"></canvas>
<button onclick="spin()">Döndür</button>
<div id="result"></div>

<script>
const tasks = [
  "Kimsenin sözünü kesmeden dinle",
  "Bugün şikâyet etme",
  "Sakin bir tonla konuş",
  "Birinin işini kolaylaştır",
  "Karşılaştığın ilk kişiye selam ver",
  "Canlı bir varlığa su ver"
];

const colors = [
  "#F44336",
  "#FF9800",
  "#FFEB3B",
  "#4CAF50",
  "#2196F3",
  "#9C27B0"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const size = canvas.width;
const center = size / 2;
const sliceAngle = (2 * Math.PI) / tasks.length;

let angle = 0;
let spinning = false;

// Yazı rengi hesapla
function getTextColor(hex) {
  const r = parseInt(hex.substr(1,2),16);
  const g = parseInt(hex.substr(3,2),16);
  const b = parseInt(hex.substr(5,2),16);
  const brightness = (r*299 + g*587 + b*114) / 1000;
  return brightness > 150 ? "#000" : "#fff";
}

// Çok satırlı yazı
function drawWrappedText(text, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let lines = [];

  for (let w of words) {
    const test = line + w + " ";
    if (ctx.measureText(test).width > maxWidth && line !== "") {
      lines.push(line);
      line = w + " ";
    } else {
      line = test;
    }
  }
  lines.push(line);

  const startY = y - (lines.length - 1) * lineHeight / 2;
  lines.forEach((l, i) => {
    ctx.fillText(l.trim(), 0, startY + i * lineHeight);
  });
}

// Çark çizimi
function drawWheel() {
  ctx.clearRect(0, 0, size, size);

  for (let i = 0; i < tasks.length; i++) {
    const start = angle + i * sliceAngle;
    const end = start + sliceAngle;
    const sliceColor = colors[i];

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, center, start, end);
    ctx.fillStyle = sliceColor;
    ctx.fill();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + sliceAngle / 2);
    ctx.rotate(Math.PI / 2);

    ctx.fillStyle = getTextColor(sliceColor);
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    drawWrappedText(tasks[i], -center * 0.6, 140, 16);
    ctx.restore();
  }

  // Üst ok
  ctx.beginPath();
  ctx.moveTo(center - 10, 5);
  ctx.lineTo(center + 10, 5);
  ctx.lineTo(center, 25);
  ctx.fillStyle = "#000";
  ctx.fill();
}

// Döndürme
function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById("result").innerText = "";

  const target = angle + Math.random() * 6 * Math.PI + 8 * Math.PI;
  const startTime = performance.now();
  const duration = 4000;

  function animate(t) {
    const progress = Math.min((t - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    angle = angle + (target - angle) * ease;

    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      showResult();
    }
  }

  requestAnimationFrame(animate);
}

// Sonuç göster
function showResult() {
  const normalized = (2 * Math.PI - (angle % (2 * Math.PI))) % (2 * Math.PI);
  const index = Math.floor(normalized / sliceAngle) % tasks.length;

  document.getElementById("result").innerText =
    "Seçilen görev: " + tasks[index];
}

drawWheel();
</script>

</body>
</html>
